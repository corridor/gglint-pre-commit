# gglint's hooks for pre-commit (https://pre-commit.com), from
# https://github.com/corridor/gglint/blob/v0.5.1/.pre-commit-hooks.yaml
# pre-commit installs gglint 0.5.1 from PyPI to run them. Written by pre-commit/build.py.

- id: gglint-secrets
  name: gglint secrets
  description: Find secrets written out in the config and instruction files of coding agents
  entry: gglint secrets
  language: python
  pass_filenames: true
  files: '^(\.mcp\.json|opencode\.jsonc?|kilo\.jsonc?|\.?crush\.json|\.?crushrc|\.rules|(CLAUDE|AGENTS?|GEMINI|QWEN|CRUSH)\.md|CLAUDE\.local\.md|\.cursorrules|\.windsurfrules|\.clinerules|\.github/(mcp\.json|copilot-instructions\.md|copilot/settings(\.local)?\.json|instructions/.*|prompts/.*|hooks/.*)|\.vscode/mcp\.json|\.zed/settings\.json|\.(claude|codex|cursor|opencode|amp|agents|agent|continue|factory|gemini|junie|kilo|kimi-code|kiro|vibe|qoder|qwen|trae)/.*)$'

- id: gglint-mcp
  name: gglint mcp
  description: Check that every coding agent in the repository gets the same MCP servers
  entry: gglint mcp --format lines
  language: python
  pass_filenames: false
  files: '^(\.mcp\.json|opencode\.jsonc?|kilo\.jsonc?|\.?crush\.json|\.?crushrc|\.github/mcp\.json|\.vscode/mcp\.json|\.zed/settings\.json|\.(codex|cursor|amp|agents|continue|factory|gemini|junie|kilo|kimi-code|kiro|vibe|qoder|qwen|trae)/.*)$'
