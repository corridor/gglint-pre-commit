# Publishes each gglint release here. Every half hour it looks up gglint's newest version on
# PyPI and, if this repository has no tag for it yet, writes its hooks with the script from
# that release (pre-commit/build.py in corridor/gglint), commits them and tags the commit
# with the version. Run it from the Actions tab to publish a release at once.

name: Update

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update

jobs:
  update:
    name: Publish gglint's newest release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To push the commit and its tag, and to keep the schedule on.
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Find gglint's newest version
        id: newest
        run: |
          version=$(curl -fsS https://pypi.org/pypi/gglint/json | python3 -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "gglint $version is published here already."
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.newest.outputs.missing
        with:
          repository: corridor/gglint
          ref: v${{ steps.newest.outputs.version }}
          path: .gglint
          persist-credentials: false
      - name: Commit its hooks and tag them
        if: steps.newest.outputs.missing
        env:
          VERSION: ${{ steps.newest.outputs.version }}
        run: |
          python3 .gglint/pre-commit/build.py --version "$VERSION" --out .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pre-commit-hooks.yaml pyproject.toml README.md
          git commit -m "gglint $VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD "v$VERSION"
      # GitHub turns off the schedule of a public repository after 60 days without activity,
      # as a long gap between releases would be; turning it on again starts the count over.
      - name: Keep the schedule on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/enable"
